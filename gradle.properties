# sample for projects using jitpack - increase timeouts to allow for on-demand builds
systemProp.org.gradle.internal.http.socketTimeout=180000
# JitPack's shared egress IPs are rate-limited by Maven Central (HTTP 429, see the mirror in settings.gradle.kts) - retry transient failures more, with a longer backoff
systemProp.org.gradle.internal.repository.max.tentatives=5
systemProp.org.gradle.internal.repository.initial.backoff=1000
version=main-SNAPSHOT
